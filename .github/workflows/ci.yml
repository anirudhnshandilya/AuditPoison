name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/validate_dataset.py
      - run: python -m pytest -q
      - run: python scripts/run_model.py --adapter keyword --output ci_predictions.jsonl
      - run: python scripts/evaluate_predictions.py ci_predictions.jsonl --output ci_metrics.json
      - run: python scripts/verify_run.py ci_predictions.manifest.json
