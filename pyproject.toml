[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "auditpoison"
version = "0.6.0"
description = "Reproducible benchmark for adversarial evidence attacks on LLM cybersecurity auditors"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anirudh Narendra Shandilya"}]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


