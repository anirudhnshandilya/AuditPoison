[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "auditpoison"
version = "0.2.0"
description = "Balanced pilot benchmark for adversarial evidence attacks on LLM cybersecurity auditors"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
